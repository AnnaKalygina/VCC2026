# data contexts: reader (src/clean/readers.py) + args + Slurm resources.
# mem_mb: engine accumulators are ~84 B x targets x measured genes + the control pool; revised from measured peak RSS
# (VIPerturb OOM at 48 GB, Orion 55-61 GB mid pass 2 -> 96 GB for the ~18k-target screens); the standard errors and
# half-delta vectors add ~24 B, per-donor sums (<= 10 batches) 4 B x (batches + 1).
# min_umi (default 1000): vocab-UMI cutoff per cell; H1 keeps every cell the scorer would (any vocab UMI).
